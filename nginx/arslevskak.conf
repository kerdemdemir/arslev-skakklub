# Årslev Skakklub — www.arslevskak.duckdns.org
# Aktiv konfiguration fra serveren. TLS-blokken er tilføjet af certbot.
# Placeres i /etc/nginx/sites-available/arslevskak og symlinkes til sites-enabled.

server {
    server_name arslevskak.duckdns.org www.arslevskak.duckdns.org;

    root /var/www/arslevskak;
    index index.html;

    # Let's Encrypt fornyelse
    location /.well-known/acme-challenge/ { allow all; root /var/www/arslevskak; }

    # Admin-siden. "^~" gør, at dette præfiks vinder over regex-blokkene
    # nedenfor, så /admin/static/admin.css ikke bliver slået op på disken.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;

        client_max_body_size 20m;   # billed- og PGN-upload
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /index.html;

    # Statiske aktiver caches længe; HTML holdes frisk
    location ~* \.(css|js|png|jpg|jpeg|ico|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/arslevskak.access.log;
    error_log  /var/log/nginx/arslevskak.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/arslevskak.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/arslevskak.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.arslevskak.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = arslevskak.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name arslevskak.duckdns.org www.arslevskak.duckdns.org;
    return 404; # managed by Certbot




}