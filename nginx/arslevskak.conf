# Årslev Skakklub — nginx
#
# Kanonisk adresse er https://aarslevskak.com (uden www).
# Alt andet sendes derhen med et 301:
#   www.aarslevskak.com          -> aarslevskak.com
#   (www.)arslevskak.duckdns.org -> aarslevskak.com   (den gamle adresse)
#   http                         -> https
#
# Placeres i /etc/nginx/sites-available/arslevskak og symlinkes til
# sites-enabled. Certifikaterne udstedes med certbot certonly --webroot,
# så certbot ikke selv skriver i denne fil.

# ---------------------------------------------------------------- selve siden
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aarslevskak.com;

    ssl_certificate     /etc/letsencrypt/live/aarslevskak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aarslevskak.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/arslevskak;
    index index.html;

    # Admin-siden. "^~" gør, at dette præfiks vinder over regex-blokkene
    # nedenfor, så /admin/static/admin.css ikke bliver slået op på disken.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;

        client_max_body_size 20m;   # billed- og PGN-upload
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Siden hed "skakskole" i et par timer, inden den blev omdøbt til
    # "juniorundervisning". Linket blev delt, så det peger videre.
    location = /skakskole.html { return 301 /juniorundervisning.html; }
    location = /skakskole     { return 301 /juniorundervisning.html; }

    location / {
        try_files $uri $uri/ $uri.html =404;

        # Siderne skal aldrig caches uden at blive kontrolleret først. Lægger
        # en administrator en nyhed ud, skal den være der med det samme - og
        # ikke om ti minutter. nginx svarer 304 via ETag, så det er billigt.
        expires -1;
    }

    error_page 404 /index.html;

    # Aktiverne må gerne caches længe: deres adresser har en indholds-hash
    # (se asset() i build.py), så de skifter navn, når filen ændrer sig.
    # Billeder i nyheder får nye, tilfældige filnavne ved hver upload.
    location ~* \.(css|js|png|jpg|jpeg|ico|webp|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/arslevskak.access.log;
    error_log  /var/log/nginx/arslevskak.error.log;
}

# ------------------------------------------------------- www -> uden www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.aarslevskak.com;

    ssl_certificate     /etc/letsencrypt/live/aarslevskak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aarslevskak.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aarslevskak.com$request_uri;
}

# -------------------------------------------- den gamle duckdns-adresse
# Beholdes, så gamle links og bogmærker bliver ved med at virke.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arslevskak.duckdns.org www.arslevskak.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/arslevskak.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arslevskak.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aarslevskak.com$request_uri;
}

# ----------------------------------------------------------- http -> https
server {
    listen 80;
    listen [::]:80;
    server_name aarslevskak.com www.aarslevskak.com
                arslevskak.duckdns.org www.arslevskak.duckdns.org;

    # Let's Encrypt fornyelse skal kunne svare på port 80
    location /.well-known/acme-challenge/ {
        root /var/www/arslevskak;
        allow all;
    }

    location / {
        return 301 https://aarslevskak.com$request_uri;
    }
}
